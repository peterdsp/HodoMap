<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title description">
  <title id="title">HodoMap design language brand board</title>
  <description id="description">HodoMap colors, typography, components and a mobile journey search concept.</description>
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#142E2C" flood-opacity="0.14"/>
    </filter>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .ink { fill: #142E2C; }
      .muted { fill: #4E615D; }
      .label { font-size: 20px; font-weight: 700; letter-spacing: .3px; }
      .caption { font-size: 16px; font-weight: 550; }
    </style>
  </defs>

  <rect width="1600" height="1200" fill="#F6F7F2"/>
  <rect x="0" y="0" width="1600" height="210" fill="#142E2C"/>

  <g transform="translate(84 54)">
    <rect x="0" y="0" width="100" height="100" rx="28" fill="#0B6B63"/>
    <path d="M31 72V30c0-8 6-14 14-14h13c8 0 14 6 14 14v42" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
    <path d="M31 48h41" fill="none" stroke="#F2B84B" stroke-width="8" stroke-linecap="round"/>
    <circle cx="31" cy="72" r="8" fill="#FFFFFF"/>
    <circle cx="72" cy="72" r="8" fill="#FFFFFF"/>
    <text x="130" y="48" class="sans" font-size="52" font-weight="760" fill="#FFFFFF">HodoMap</text>
    <text x="132" y="82" class="sans" font-size="20" font-weight="560" fill="#B8C9C5">Greece by bus, clearly.</text>
  </g>

  <g transform="translate(84 274)">
    <text class="sans ink" font-size="22" font-weight="750">COLOR SYSTEM</text>
    <text y="36" class="sans muted" font-size="17">Calm orientation, warm travel moments, visible trust.</text>

    <g transform="translate(0 78)">
      <rect width="176" height="128" rx="20" fill="#142E2C"/>
      <text x="18" y="88" class="sans" font-size="18" font-weight="700" fill="#FFFFFF">Aegean Ink</text>
      <text x="18" y="111" class="sans" font-size="15" fill="#B8C9C5">#142E2C</text>
    </g>
    <g transform="translate(194 78)">
      <rect width="176" height="128" rx="20" fill="#0B6B63"/>
      <text x="18" y="88" class="sans" font-size="18" font-weight="700" fill="#FFFFFF">Route Teal</text>
      <text x="18" y="111" class="sans" font-size="15" fill="#DCEBE7">#0B6B63</text>
    </g>
    <g transform="translate(388 78)">
      <rect width="176" height="128" rx="20" fill="#F2B84B"/>
      <text x="18" y="88" class="sans" font-size="18" font-weight="700" fill="#4A2E00">Sun Amber</text>
      <text x="18" y="111" class="sans" font-size="15" fill="#4A2E00">#F2B84B</text>
    </g>
    <g transform="translate(582 78)">
      <rect width="176" height="128" rx="20" fill="#FFFFFF" stroke="#CBD8D4" stroke-width="2"/>
      <text x="18" y="88" class="sans ink" font-size="18" font-weight="700">White</text>
      <text x="18" y="111" class="sans muted" font-size="15">#FFFFFF</text>
    </g>

    <text y="260" class="sans ink" font-size="22" font-weight="750">TYPE AND VOICE</text>
    <text y="318" class="sans ink" font-size="42" font-weight="740">Athens to Kalamata</text>
    <text y="358" class="sans muted" font-size="21">Αθήνα προς Καλαμάτα  •  Tiranë drejt Janinës</text>
    <text y="401" class="sans ink" font-size="18">Clear hierarchy, real place names and honest source language.</text>

    <text y="474" class="sans ink" font-size="22" font-weight="750">TRUST STATES</text>
    <g transform="translate(0 504)">
      <rect width="190" height="46" rx="23" fill="#E3F3E9"/>
      <circle cx="25" cy="23" r="8" fill="#185C38"/>
      <text x="44" y="29" class="sans" font-size="16" font-weight="700" fill="#185C38">Verified schedule</text>
    </g>
    <g transform="translate(206 504)">
      <rect width="180" height="46" rx="23" fill="#FFF1C9"/>
      <circle cx="25" cy="23" r="8" fill="#F2B84B"/>
      <text x="44" y="29" class="sans" font-size="16" font-weight="700" fill="#4A2E00">Review pending</text>
    </g>
    <g transform="translate(402 504)">
      <rect width="170" height="46" rx="23" fill="#FCE8E5"/>
      <circle cx="25" cy="23" r="8" fill="#8F2F25"/>
      <text x="44" y="29" class="sans" font-size="16" font-weight="700" fill="#8F2F25">Limited data</text>
    </g>

    <text y="628" class="sans ink" font-size="22" font-weight="750">COMPONENT SHAPE</text>
    <g transform="translate(0 662)" filter="url(#cardShadow)">
      <rect width="736" height="172" rx="24" fill="#FFFFFF"/>
      <text x="24" y="34" class="sans muted" font-size="14" font-weight="650">FRI, 31 JULY  •  DIRECT</text>
      <text x="24" y="83" class="sans ink" font-size="32" font-weight="760">08:30</text>
      <text x="170" y="83" class="sans ink" font-size="32" font-weight="760">11:15</text>
      <path d="M104 72h42" stroke="#0B6B63" stroke-width="4" stroke-linecap="round"/>
      <circle cx="104" cy="72" r="6" fill="#FFFFFF" stroke="#0B6B63" stroke-width="3"/>
      <circle cx="146" cy="72" r="6" fill="#0B6B63"/>
      <text x="24" y="111" class="sans ink" font-size="17" font-weight="650">Athens</text>
      <text x="170" y="111" class="sans ink" font-size="17" font-weight="650">Kalamata</text>
      <text x="24" y="145" class="sans muted" font-size="15">KTEL Messinias  •  2h 45m</text>
      <rect x="544" y="54" width="168" height="58" rx="16" fill="#0B6B63"/>
      <text x="628" y="89" text-anchor="middle" class="sans" font-size="16" font-weight="720" fill="#FFFFFF">View journey</text>
    </g>
  </g>

  <g transform="translate(930 250)">
    <rect x="0" y="0" width="520" height="890" rx="64" fill="#142E2C" filter="url(#cardShadow)"/>
    <rect x="18" y="18" width="484" height="854" rx="48" fill="#F6F7F2"/>
    <rect x="184" y="35" width="152" height="28" rx="14" fill="#142E2C"/>

    <rect x="18" y="18" width="484" height="268" rx="48" fill="#142E2C"/>
    <text x="52" y="102" class="sans" font-size="22" font-weight="720" fill="#FFFFFF">HodoMap</text>
    <text x="52" y="151" class="sans" font-size="36" font-weight="760" fill="#FFFFFF">Where are you</text>
    <text x="52" y="191" class="sans" font-size="36" font-weight="760" fill="#FFFFFF">going today?</text>
    <text x="52" y="226" class="sans" font-size="16" fill="#B8C9C5">Verified intercity journeys across Greece</text>

    <g transform="translate(42 250)" filter="url(#cardShadow)">
      <rect width="436" height="246" rx="26" fill="#FFFFFF"/>
      <text x="24" y="32" class="sans muted" font-size="13" font-weight="700">FROM</text>
      <circle cx="35" cy="72" r="9" fill="#FFFFFF" stroke="#0B6B63" stroke-width="4"/>
      <text x="62" y="79" class="sans ink" font-size="20" font-weight="680">Athens</text>
      <line x1="35" y1="84" x2="35" y2="117" stroke="#CBD8D4" stroke-width="3"/>
      <circle cx="35" cy="129" r="9" fill="#0B6B63"/>
      <text x="62" y="136" class="sans ink" font-size="20" font-weight="680">Kalamata</text>
      <line x1="24" y1="157" x2="412" y2="157" stroke="#E7EEEB" stroke-width="2"/>
      <text x="24" y="187" class="sans muted" font-size="13" font-weight="700">TRAVEL DATE</text>
      <text x="24" y="216" class="sans ink" font-size="18" font-weight="650">Friday, 31 July</text>
      <rect x="266" y="177" width="146" height="52" rx="14" fill="#0B6B63"/>
      <text x="339" y="209" text-anchor="middle" class="sans" font-size="15" font-weight="720" fill="#FFFFFF">Search journeys</text>
    </g>

    <text x="42" y="548" class="sans ink" font-size="20" font-weight="730">Recent journeys</text>
    <g transform="translate(42 574)">
      <rect width="436" height="102" rx="20" fill="#FFFFFF"/>
      <circle cx="42" cy="51" r="22" fill="#DCEBE7"/>
      <path d="M33 51h18M46 44l7 7-7 7" fill="none" stroke="#0B6B63" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="78" y="45" class="sans ink" font-size="17" font-weight="700">Athens to Patras</text>
      <text x="78" y="70" class="sans muted" font-size="14">Tomorrow  •  12 journeys</text>
      <path d="M397 43l9 8-9 8" fill="none" stroke="#4E615D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="42" y="727" class="sans ink" font-size="20" font-weight="730">Coverage today</text>
    <g transform="translate(42 750)">
      <rect width="436" height="82" rx="20" fill="#EFF7F5"/>
      <circle cx="42" cy="41" r="18" fill="#E3F3E9"/>
      <path d="M34 41l6 6 11-13" fill="none" stroke="#185C38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="74" y="36" class="sans ink" font-size="15" font-weight="700">62 operators tracked</text>
      <text x="74" y="59" class="sans muted" font-size="13">Coverage varies by operator and season</text>
    </g>
  </g>
</svg>
